{% extends "layout.html" %}
{% block body %}
  <h1>Admin Dashboard</h1>
  <div class="row mb-4">
    {% for label, count in stats.items() %}
    <div class="col-sm-4 col-md-2 mb-3">
      <div class="card text-center p-3 shadow-sm">
        <h6 class="card-title text-muted">{{ label }}</h6>
        <p class="display-6">{{ count }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="list-group">
    <a href="{{ url_for('admin_users') }}"           class="list-group-item list-group-item-action">Manage Users</a>
    <a href="{{ url_for('admin_room_types') }}"      class="list-group-item list-group-item-action">Room Types</a>
    <a href="{{ url_for('admin_extra_services') }}"  class="list-group-item list-group-item-action">Extra Services</a>
    <a href="{{ url_for('admin_guest_options') }}"   class="list-group-item list-group-item-action">Guest Options</a>
    <a href="{{ url_for('booking') }}"               class="list-group-item list-group-item-action text-end">← Back to Site</a>
  </div>
{% endblock %}
