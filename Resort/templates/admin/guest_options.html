{% extends "layout.html" %}
{% block body %}
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mb-3">← Dashboard</a>
  <h2>Guest Options</h2>
  <a href="{{ url_for('admin_create_guest_option') }}" class="btn btn-primary mb-3">+ New Option</a>
  <table class="table table-hover">
    <thead class="table-light">
      <tr><th>ID</th><th>Adults</th><th>Children</th><th>Label</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for o in opts %}
      <tr>
        <td>{{ o.id }}</td>
        <td>{{ o.adult_count }}</td>
        <td>{{ o.child_count }}</td>
        <td>{{ o.label }}</td>
        <td>
          <a href="{{ url_for('admin_edit_guest_option', opt_id=o.id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{{ url_for('admin_delete_guest_option', opt_id=o.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete?');">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
