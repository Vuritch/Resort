{% extends "layout.html" %}
{% block body %}
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mb-3">← Dashboard</a>
  <h2>Users</h2>
  <a href="{{ url_for('admin_create_user') }}" class="btn btn-primary mb-3">+ New User</a>
  <table class="table table-hover">
    <thead class="table-light">
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>
        <td>
          <a href="{{ url_for('admin_edit_user',   user_id=u.id) }}"   class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{{ url_for('admin_delete_user', user_id=u.id) }}"   class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this user?');">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
